{% macro field_error(message) %}
	{% if !message.is_empty() %}<p class="field-error">{{ message }}</p>{% endif %}
{% endmacro %}
<section class="form-section"><h2>Notes</h2><p>Private context to make this link easier to find later.</p><div class="field"><label for="notes">Notes</label><textarea class="control" id="notes" name="notes" maxlength="4000" aria-invalid="{{ model.invalid("notes") }}">{{ model.notes }}</textarea>{{ field_error(model.error_text("notes")) }}</div></section>
