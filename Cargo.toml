[workspace]
resolver = "3"
members = [
    "crates/shorten",
    "crates/shorten-web",
    "crates/shorten-server",
    "crates/shorten-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/LinhNC/onez-go-rust"
publish = false

[workspace.dependencies]
shorten = { path = "crates/shorten" }
shorten-web = { path = "crates/shorten-web" }

axum = { version = "0.8", features = ["macros"] }
askama = "0.16"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "http1", "http2", "service", "tokio"] }
http = "1"
bytes = "1"

rusqlite = { version = "0.42", features = ["bundled", "array", "trace", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.37"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "time"] }
chrono = { version = "0.4", features = ["serde"] }
humantime = "2"
rand = "0.9"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
base64 = "0.22"
regex = "1"
url = "2"
ipnet = "2"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
futures = "0.3"
rust-embed = "8"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "unwind"
strip = "debuginfo"
